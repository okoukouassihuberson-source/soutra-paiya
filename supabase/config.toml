# ============================================================================
# Supabase — configuration du stack LOCAL de développement (`supabase start`).
#
# ⚠️ Ce fichier ne configure QUE l'instance Docker locale.
# Il n'a AUCUN effet sur le projet Supabase cloud de production.
# ============================================================================
project_id = "soutra-paiya"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
# Longueur minimale du mot de passe (cohérent avec passwordSchema côté code).
minimum_password_length = 8

[auth.sms]
# Authentification par numéro + mot de passe : la confirmation du numéro par
# OTP est désactivée -> signUp({ phone, password }) crée le compte sans SMS.
enable_signup = true
enable_confirmations = false
