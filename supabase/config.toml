# ============================================================================
# Supabase — configuration du stack LOCAL de développement (`supabase start`).
#
# ⚠️ Ce fichier ne configure QUE l'instance Docker locale.
# Il n'a AUCUN effet sur le projet Supabase cloud de production.
# ============================================================================
project_id = "soutra-paiya"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
# Longueur minimale du mot de passe (cohérent avec passwordSchema côté code).
minimum_password_length = 8

[auth.sms]
# Authentification par numéro + mot de passe : la confirmation du numéro par
# OTP est désactivée -> signUp({ phone, password }) crée le compte sans SMS.
enable_signup = true
enable_confirmations = false

# ============================================================================
# Edge Functions
# ============================================================================
# Webhook CinetPay (Phase 12 — migration Paystack → CinetPay).
# Auth via header `x-token` (HMAC-SHA256 sur les champs cpm_*, vérifié dans
# le code via _shared/cinetpay.ts). Pas de JWT user — c'est CinetPay qui
# appelle directement.
[functions.cinetpay-webhook]
verify_jwt = false

# Déclenchée par les Database Webhooks Supabase, qui s'authentifient via
# l'en-tête Authorization = Bearer <service_role_key>. La fonction vérifie
# ce header avant d'agir -> aucune source publique n'est acceptée.
[functions.send-push]
verify_jwt = false
