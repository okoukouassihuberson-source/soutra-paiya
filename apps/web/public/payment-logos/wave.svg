<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" role="img" aria-label="Wave">
  <title>Wave</title>
  <rect width="240" height="80" rx="12" fill="#1DC8FB"/>

  <g transform="translate(12, 8)">
    <!-- Bras levé (gauche du pingouin, salue) -->
    <path d="M 14 30 Q 2 22, 4 10 Q 7 2, 14 5 L 18 28 Z" fill="#000000"/>

    <!-- Corps principal noir (forme oeuf) -->
    <ellipse cx="30" cy="36" rx="22" ry="28" fill="#000000"/>

    <!-- Ventre blanc -->
    <ellipse cx="30" cy="42" rx="14" ry="20" fill="#FFFFFF"/>

    <!-- Œil gauche -->
    <circle cx="22" cy="22" r="3.2" fill="#FFFFFF"/>
    <circle cx="22.5" cy="22.5" r="1.8" fill="#000000"/>

    <!-- Œil droit -->
    <circle cx="36" cy="22" r="3.2" fill="#FFFFFF"/>
    <circle cx="36.5" cy="22.5" r="1.8" fill="#000000"/>

    <!-- Bec orange (diamant) -->
    <path d="M 29 28 L 22 33 L 29 39 L 36 33 Z" fill="#FF9933"/>
    <line x1="22" y1="33" x2="36" y2="33" stroke="#E07820" stroke-width="0.5"/>

    <!-- Pieds palmés orange -->
    <ellipse cx="20" cy="63" rx="7" ry="3" fill="#FF9933"/>
    <ellipse cx="40" cy="63" rx="7" ry="3" fill="#FF9933"/>
  </g>

  <text x="80" y="56" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="40" fill="#000000" letter-spacing="-2">wave</text>
</svg>
