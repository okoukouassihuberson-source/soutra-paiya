<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#FF6B1A" />
  <title>Hors ligne — Soutra-Explore</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(180deg, #FAF7F2 0%, #FFF1E6 100%);
      color: #1A1D2E;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .wrap { max-width: 420px; width: 100%; text-align: center; }
    .icon {
      width: 96px; height: 96px;
      margin: 0 auto 24px;
      border-radius: 22px;
      background: linear-gradient(135deg, #FF6B1A, #E5500D);
      box-shadow: 0 12px 30px rgba(255,107,26,.35);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 38px; letter-spacing: -1.5px;
    }
    h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.5px; }
    p { color: #64748B; line-height: 1.55; margin: 0 0 28px; font-size: 15px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; border-radius: 999px;
      background: #FF6B1A; color: #fff; font-weight: 700;
      border: 0; cursor: pointer; font-size: 15px;
      box-shadow: 0 10px 24px rgba(255,107,26,.3);
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .btn:hover { background: #E5500D; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .hint { margin-top: 18px; color: #94A3B8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="icon" aria-hidden="true">SP</div>
    <h1>Pas de connexion</h1>
    <p>Tu sembles hors ligne. Vérifie ta connexion et réessaie — Soutra-Explore reviendra dès que ton réseau revient.</p>
    <button class="btn" onclick="location.reload()" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 15.45-6.36L21 8"/>
        <path d="M21 3v5h-5"/>
        <path d="M21 12a9 9 0 0 1-15.45 6.36L3 16"/>
        <path d="M3 21v-5h5"/>
      </svg>
      Réessayer
    </button>
    <div class="hint">Si le problème persiste, redémarre l'application.</div>
  </main>
  <script>
    // Recharge automatiquement dès que la connexion revient.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
